name: 機能の提案
description: 新しい機能や改善を提案する
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どのような場面で、何に困っていますか。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: どうなると良いと思いますか。
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
