<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1464" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- 紙 -->
  <g filter="url(#shadow)">
    <path d="M300 214h300l124 124v448a24 24 0 0 1-24 24H300a24 24 0 0 1-24-24V238a24 24 0 0 1 24-24z" fill="#FFFFFF"/>
    <path d="M600 214v100a24 24 0 0 0 24 24h100z" fill="#D9DCF7"/>
  </g>
  <!-- 原文の行（灰色） -->
  <g stroke="#C7CAD9" stroke-width="26" stroke-linecap="round">
    <line x1="344" y1="420" x2="560" y2="420"/>
    <line x1="344" y1="484" x2="680" y2="484"/>
  </g>
  <!-- 分光された行（スペクトル） -->
  <g stroke-width="26" stroke-linecap="round">
    <line x1="344" y1="560" x2="680" y2="560" stroke="#FF6B6B"/>
    <line x1="344" y1="624" x2="640" y2="624" stroke="#FFB340"/>
    <line x1="344" y1="688" x2="680" y2="688" stroke="#34C759"/>
    <line x1="344" y1="752" x2="560" y2="752" stroke="#5E5CE6"/>
  </g>
  <!-- プリズム -->
  <path d="M196 760 L292 594 L388 760 Z" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  <line x1="120" y1="704" x2="250" y2="676" stroke="url(#beam)" stroke-width="12" stroke-linecap="round"/>
</svg>
